services:
  - type: web
    name: policy-rag-assistant
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-20b
      - key: EMBEDDING_MODEL
        value: all-MiniLM-L6-v2
      - key: MIN_FAITHFULNESS_SCORE
        value: "0.75"
      - key: MIN_ACCURACY_SCORE
        value: "0.70"
