name: CI — Policy RAG Assistant

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  LLM_PROVIDER: groq
  LLM_MODEL: openai/gpt-oss-20b
  MIN_FAITHFULNESS_SCORE: "0.75"
  MIN_ACCURACY_SCORE: "0.70"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff black
      - name: Run Ruff linter
        run: ruff check app/ tests/ evaluation/
      - name: Run Black formatter check
        run: black --check app/ tests/ evaluation/

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests (ingestion + security)
        run: |
          pytest tests/test_ingestion.py tests/test_security.py \
            -v --tb=short \
            --cov=app --cov-report=xml
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage.xml

  integration-tests:
    name: Integration Tests (RAG Agent)
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run agent integration tests
        run: pytest tests/test_rag.py -v --tb=short -k "not injection"
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

  evaluation:
    name: RAG Quality Evaluation
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run evaluation
        run: python evaluation/evaluate.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: evaluation/eval_report.json
      - name: Check evaluation thresholds
        run: |
          python - << 'EOF'
          import json, sys
          with open("evaluation/eval_report.json") as f:
              report = json.load(f)
          ci_passed = report.get("ci_passed", False)
          summary = report["summary"]
          print(f"Accuracy:    {summary['overall_accuracy']:.1%}")
          print(f"Faithfulness:{summary['faithfulness_score']:.1%}")
          if not ci_passed:
              print("FAIL: Evaluation scores below threshold!")
              sys.exit(1)
          print("PASS: All thresholds met!")
          EOF

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t policy-rag-assistant:ci .
      - name: Test Docker health check
        run: |
          docker run -d --name test-container \
            -e GROQ_API_KEY=test_key \
            -p 8000:8000 \
            policy-rag-assistant:ci
          sleep 10
          curl -f http://localhost:8000/health || exit 1
          docker stop test-container
